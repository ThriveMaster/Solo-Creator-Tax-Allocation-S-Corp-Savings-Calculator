<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator S-Corp Tax Savings Calculator</title>
    <!-- Tailwind CSS for modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font for executive readability -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Top Header -->
        <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-700 p-6 text-white">
            <h1 class="text-2xl font-extrabold tracking-tight">S-Corp Tax Savings Calculator</h1>
            <p class="text-indigo-100 text-sm mt-1">Estimate your potential payroll tax savings by splitting income between Salary and Distributions.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 divide-y lg:divide-y-0 lg:divide-x divide-zinc-200 dark:divide-zinc-800">
            
            <!-- Inputs -->
            <div class="p-6 lg:col-span-5 flex flex-col gap-6 bg-zinc-50/50 dark:bg-zinc-900/40">
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Net Annual Profit ($)</label>
                        <input type="number" id="input-profit" value="120000" class="w-full mt-2 bg-white dark:bg-zinc-800 border border-zinc-700 rounded-lg p-3 font-bold text-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <div>
                        <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Salary Split (%)</label>
                        <input type="range" id="slider-split" min="40" max="90" value="80" class="w-full mt-3 accent-blue-600">
                        <div class="flex justify-between text-xs text-zinc-500 mt-1">
                            <span>40% Salary</span>
                            <span id="val-split" class="font-bold text-blue-600">80% Salary</span>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-zinc-200 dark:border-zinc-800">
                        <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Annual Compliance Cost ($)</label>
                        <input type="number" id="input-compliance" value="2000" class="w-full mt-2 bg-white dark:bg-zinc-800 border border-zinc-700 rounded-lg p-2 font-bold outline-none focus:ring-2 focus:ring-blue-500">
                        <p class="text-[10px] text-zinc-500 mt-1">Payroll services, corporate returns, state fees.</p>
                    </div>
                </div>
            </div>

            <!-- Outputs -->
            <div class="p-6 lg:col-span-7 bg-white dark:bg-zinc-900 flex flex-col gap-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-4 bg-zinc-100 dark:bg-zinc-800 rounded-xl border border-zinc-200 dark:border-zinc-700">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase">Est. Tax Savings</span>
                        <div id="stat-savings" class="text-3xl font-extrabold text-emerald-600 mt-1">$0</div>
                    </div>
                    <div class="p-4 bg-zinc-100 dark:bg-zinc-800 rounded-xl border border-zinc-200 dark:border-zinc-700">
                        <span class="text-[10px] font-bold text-zinc-500 uppercase">Net Benefit</span>
                        <div id="stat-net" class="text-3xl font-extrabold text-indigo-600 mt-1">$0</div>
                    </div>
                </div>
                <div class="h-48 w-full"><canvas id="savings-chart"></canvas></div>
                <div id="audit-feedback" class="p-4 rounded-xl border border-zinc-200 bg-zinc-50 text-xs text-zinc-600 dark:bg-zinc-800 dark:border-zinc-700 dark:text-zinc-300 italic"></div>
                <button id="btn-copy" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl py-3 shadow-lg transition-all">Copy S-Corp Report</button>
            </div>
        </div>
    </div>

    <script>
        const inputProfit = document.getElementById("input-profit");
        const sliderSplit = document.getElementById("slider-split");
        const inputCompliance = document.getElementById("input-compliance");
        const statSavings = document.getElementById("stat-savings");
        const statNet = document.getElementById("stat-net");
        const feedback = document.getElementById("audit-feedback");
        let chart = null;

        const calculate = () => {
            const profit = parseFloat(inputProfit.value) || 0;
            const split = parseFloat(sliderSplit.value) / 100;
            const compliance = parseFloat(inputCompliance.value) || 0;
            
            document.getElementById("val-split").textContent = `${Math.round(split * 100)}% Salary`;

            const salary = profit * split;
            const distributions = profit * (1 - split);
            
            const seTaxSoleProp = profit * 0.153;
            const seTaxSCorp = salary * 0.153;
            
            const grossSavings = seTaxSoleProp - seTaxSCorp;
            const netBenefit = grossSavings - compliance;

            statSavings.textContent = `$${Math.max(0, grossSavings).toLocaleString(undefined, {maximumFractionDigits:0})}`;
            statNet.textContent = `$${netBenefit.toLocaleString(undefined, {maximumFractionDigits:0})}`;

            feedback.innerHTML = netBenefit > 0 
                ? `<strong>Strategy Insight:</strong> By shifting $${Math.round(distributions).toLocaleString()} to distributions, you avoid self-employment tax on that portion. After deducting $${compliance.toLocaleString()} in compliance costs, you net <strong>$${netBenefit.toLocaleString()}</strong> in annual savings.`
                : "<strong>Strategy Insight:</strong> Your profit level or compliance costs make an S-Corp election non-beneficial at this time. Focus on increasing net profit before electing S-Corp status.";

            renderChart(seTaxSoleProp, seTaxSCorp, compliance);
        };

        const renderChart = (sole, scorp, compliance) => {
            const ctx = document.getElementById("savings-chart").getContext("2d");
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Sole Prop Tax', 'S-Corp Payroll Tax', 'Compliance Cost'],
                    datasets: [{ data: [sole, scorp, compliance], backgroundColor: ['#ef4444', '#3b82f6', '#f59e0b'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        };

        [inputProfit, sliderSplit, inputCompliance].forEach(el => el.addEventListener("input", calculate));
        document.getElementById("btn-copy").addEventListener("click", () => {
            navigator.clipboard.writeText(`S-Corp Tax Report:\nProfit: ${inputProfit.value}\nSavings: ${statSavings.textContent}\nNet Benefit: ${statNet.textContent}\n\n${feedback.innerText}`);
            alert("Report copied to clipboard!");
        });
        calculate();
    </script>
</body>
</html>
